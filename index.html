<style>
:root{--bg:#F3F5F7;--panel:#fff;--ink:#1F2A44;--sub:#5F6B7F;--line:#D9DEE5;--accent:#0F7B8A;--grid:#E6EAEF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--panel:#1B2436;--ink:#E7ECF4;--sub:#9AA6BA;--line:#2C3850;--accent:#4FC3D3;--grid:#26324A}}
:root[data-theme="dark"]{--bg:#121826;--panel:#1B2436;--ink:#E7ECF4;--sub:#9AA6BA;--line:#2C3850;--accent:#4FC3D3;--grid:#26324A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}
header{padding:16px 20px 4px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.file{font-size:14px;color:var(--sub)}
.file label{display:inline-block;padding:7px 14px;border:1px solid var(--accent);color:var(--accent);border-radius:6px;cursor:pointer;font-weight:500}
.file label:hover,.file input:focus-visible+label{background:var(--accent);color:var(--bg)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
#status{margin-left:10px}
.ctl{padding:10px 20px 0;display:flex;gap:12px;align-items:flex-start}
.ctl>.name{flex:0 0 44px;padding-top:8px;font-size:14px;font-weight:700;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chips button{font:inherit;font-size:15px;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vgroups{display:flex;flex-direction:column;gap:8px;min-width:0}
#subvars button{font-size:14px;padding:6px 13px}
#subvars button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#regions button::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rc);margin-right:7px}
#regions button[aria-pressed="true"]{background:var(--rc);border-color:var(--rc);color:var(--rt)}
#regions button[aria-pressed="true"]::before{background:var(--rt)}
main{padding:16px 20px 28px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px 12px}
.panel{margin-bottom:16px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.ph h2{margin:0;font-size:18px;font-weight:700}
.ph button{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--sub);border-radius:6px;padding:3px 10px;cursor:pointer}
.ph button:hover{color:var(--ink);border-color:var(--sub)}
.ph button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:48px 0;text-align:center;color:var(--sub)}
.box{position:relative;height:min(55vh,380px);min-height:260px}
@media (max-width:640px){.ctl{flex-direction:column;gap:2px}.ctl>.name{flex:none;padding-top:0}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var rows=[],cols=[],regionKey="지역",yearKey="연도",selected=[],allRegs=[],selVars=[],group=null,panels={};
var groupVars={},groupOrder=[],lastVar={};
var REGION_COLORS={"거제시":["#E03A3E","#fff"],"여수시":["#F28C28","#1F2A44"],"광양시":["#E3AB00","#1F2A44"],"군산시":["#2E9E4F","#fff"],"포항시":["#2F80ED","#fff"],"구미시":["#4B4FC4","#fff"],"창원시":["#8E44AD","#fff"],"울산광역시":["#E0559A","#fff"]};
function rcolor(g){return REGION_COLORS[g]||["#0F7B8A","#fff"]}
var GROUPS=[["일자리","종사자수_"],["생산연령인구","생산연령인구_"],["빈집","빈집"],["가구","가구수"]];
var DEFAULT_GROUP="일자리";

function parseCSV(t){
  t=t.replace(/^﻿/,"");var out=[],r=[],f="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";if(r.length>1||r[0]!=="")out.push(r);r=[]}
    else f+=c}
  if(f!==""||r.length){r.push(f);out.push(r)}
  return out}

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function label(v){return v.replace(/_/g," ")}
function chip(text,onclick){var b=document.createElement("button");b.type="button";b.textContent=text;b.setAttribute("aria-pressed","false");b.onclick=onclick;return b}

function load(text,name){
  var t=parseCSV(text);cols=t[0].map(function(s){return s.trim()});
  rows=t.slice(1).map(function(r){var o={};cols.forEach(function(c,i){var v=(r[i]||"").trim();
    o[c]=(v===""||isNaN(Number(v)))?(v===""?null:v):Number(v)});return o});
  var regs=[];rows.forEach(function(r){if(regs.indexOf(r[regionKey])<0)regs.push(r[regionKey])});
  var nav=document.getElementById("regions");nav.innerHTML="";
  regs.forEach(function(g){var b=chip(g,function(){setRegion(g)});b.style.setProperty("--rc",rcolor(g)[0]);b.style.setProperty("--rt",rcolor(g)[1]);nav.appendChild(b)});

  var sample=rows[0]||{};
  var vars=cols.filter(function(c){return c!==regionKey&&c!==yearKey&&typeof sample[c]!=="string"});
  groupVars={};groupOrder=[];lastVar={};
  var used={};
  GROUPS.concat([["기타",""]]).forEach(function(G){
    var list=vars.filter(function(v){return !used[v]&&(G[1]===""||v.indexOf(G[1])>=0)});
    if(!list.length)return;list.forEach(function(v){used[v]=1});
    groupVars[G[0]]=list;groupOrder.push(G[0])});
  var gbox=document.getElementById("groups");gbox.innerHTML="";
  groupOrder.forEach(function(g){var b=chip(g,function(){setGroup(g)});b.dataset.g=g;gbox.appendChild(b)});
  document.getElementById("subvars").dataset.g="";
  Object.keys(panels).forEach(function(k){panels[k].chart.destroy()});panels={};document.getElementById("panels").innerHTML="";

  document.getElementById("status").textContent=name+" · "+rows.length+"행";
  allRegs=regs;selected=selected.filter(function(g){return regs.indexOf(g)>=0});if(!selected.length)selected=[regs[0]];
  selVars=selVars.filter(function(v){return vars.indexOf(v)>=0});
  if(!selVars.length){var dg=groupVars[DEFAULT_GROUP]?DEFAULT_GROUP:groupOrder[0];selVars=[groupVars[dg][0]]}
  group=groupOf(selVars[0]);
  sync();draw()}

function sync(){
  Array.prototype.forEach.call(document.querySelectorAll("#regions button"),function(b){b.setAttribute("aria-pressed",String(selected.indexOf(b.textContent)>=0))});
  Array.prototype.forEach.call(document.querySelectorAll("#groups button"),function(b){b.setAttribute("aria-pressed",String(b.dataset.g===group))});
  var sb=document.getElementById("subvars");
  if(sb.dataset.g!==group){sb.innerHTML="";sb.dataset.g=group;
    groupVars[group].forEach(function(v){var b=chip(label(v),function(){setVar(v)});b.dataset.v=v;sb.appendChild(b)})}
  Array.prototype.forEach.call(sb.querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",String(selVars.indexOf(b.dataset.v)>=0))})}
function groupOf(v){for(var i=0;i<groupOrder.length;i++){if(groupVars[groupOrder[i]].indexOf(v)>=0)return groupOrder[i]}return groupOrder[0]}
function setGroup(g){group=g;sync()}
function setRegion(g){var i=selected.indexOf(g);if(i>=0)selected.splice(i,1);else selected.push(g);sync();draw()}
function setVar(v){var i=selVars.indexOf(v);if(i>=0)selVars.splice(i,1);else selVars.push(v);sync();draw()}

function makePanel(v){
  var el=document.createElement("section");el.className="panel";
  el.innerHTML='<div class="ph"><h2></h2><button type="button">닫기 ✕</button></div><div class="box"><canvas role="img"></canvas></div>';
  el.querySelector("canvas").setAttribute("aria-label",label(v)+" 연도별 꺾은선 그래프");
  el.querySelector("button").onclick=function(){setVar(v)};
  return el}

function isPct(v){return /증가율|순이동률|퍼센트$/.test(v)}
function fmt(x,v){return isPct(v)?x.toLocaleString(undefined,{maximumFractionDigits:2})+"%":x.toLocaleString()}
function newChart(canvas,v){
  return new Chart(canvas,{
    type:"line",
    data:{labels:[],datasets:[]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:450},
      interaction:{mode:"nearest",intersect:true},
      plugins:{legend:{display:false,labels:{usePointStyle:true,font:{size:14}}},
        tooltip:{callbacks:{label:function(c){
          var cur=c.parsed.y,line=c.dataset.label+": "+(cur==null?"데이터 없음":fmt(cur,v));
          var prev=c.dataIndex>0?c.dataset.data[c.dataIndex-1]:null;
          if(cur==null||prev==null)return line;
          var d=cur-prev,a=Math.abs(d).toLocaleString(undefined,{maximumFractionDigits:2});
          return [line,"전년 대비 "+(d>0?"+":(d<0?"−":""))+a+(isPct(v)?"%p":"")]}}}},
      scales:{x:{ticks:{font:{size:14}},grid:{display:false}},
              y:{ticks:{font:{size:14},callback:function(x){return fmt(x,v)}},grid:{},title:{display:false}}}}})}

function fill(p,v){
  var ch=p.chart;
  var yrs=[];rows.forEach(function(r){if(r[v]!=null&&yrs.indexOf(r[yearKey])<0)yrs.push(r[yearKey])});yrs.sort(function(a,b){return a-b});
  var order=allRegs.filter(function(g){return selected.indexOf(g)>=0});
  var sub=css("--sub"),grid=css("--grid");
  var sets=order.map(function(g){
    var byYear={};rows.forEach(function(r){if(r[regionKey]===g)byYear[r[yearKey]]=r[v]});
    var c=rcolor(g)[0];
    return {label:g,data:yrs.map(function(y){return byYear[y]==null?null:byYear[y]}),borderColor:c,backgroundColor:c,borderWidth:3,pointRadius:5,pointHoverRadius:8,pointHitRadius:6,tension:0.2,spanGaps:false}});
  p.el.querySelector("h2").textContent=!order.length?label(v)+" · 지역을 선택하면 그래프가 나타나요":(order.length===1?order[0]+" · "+label(v):label(v)+" · "+order.join(", ")+" 비교");
  ch.data.labels=yrs;ch.data.datasets=sets;
  ch.options.plugins.legend.display=order.length>1;
  ch.options.plugins.legend.labels.color=sub;
  ch.options.scales.x.ticks.color=sub;ch.options.scales.y.ticks.color=sub;ch.options.scales.y.grid.color=grid;
  ch.options.scales.y.title={display:true,text:label(v),color:sub};
  ch.update()}

function draw(){
  var pan=document.getElementById("panels");
  Object.keys(panels).forEach(function(v){if(selVars.indexOf(v)<0){panels[v].chart.destroy();pan.removeChild(panels[v].el);delete panels[v]}});
  var em=pan.querySelector(".empty");if(em)pan.removeChild(em);
  if(!selVars.length){var d=document.createElement("div");d.className="empty";d.textContent="변수를 선택하면 그래프가 추가돼요.";pan.appendChild(d);return}
  selVars.forEach(function(v){
    if(!panels[v]){var el=makePanel(v);pan.appendChild(el);panels[v]={el:el,chart:newChart(el.querySelector("canvas"),v)}}
    else pan.appendChild(panels[v].el);
    fill(panels[v],v)})}

document.getElementById("f").addEventListener("change",function(e){
  var file=e.target.files[0];if(!file)return;
  file.arrayBuffer().then(function(buf){
    var text;try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(err){text=new TextDecoder("euc-kr").decode(buf)}
    load(text,file.name)})});
if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){draw()});
load(document.getElementById("seed").textContent,"data_2012_2020_master_final_v5.csv");
</script>
